<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HabitFlow — Habit Tracker</title>
  <style>
    :root {
      --blue: #2563eb;
      --orange: #f97316;
      --red: #ef4444;
      --black: #111827;
      --white: #ffffff;
      --background: #f3f6fc;
      --muted: #667085;
      --border: #e5eaf2;
      --green: #16a34a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--black);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: var(--blue);
      color: var(--white);
      font-size: 24px;
      font-weight: 800;
    }

    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 2px; font-size: 23px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }

    .date-chip {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--white);
      color: var(--muted);
      font-size: 14px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(310px, .85fr);
      gap: 20px;
    }

    .main-column, .side-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-width: 0;
    }

    .card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 5px 18px rgba(17, 24, 39, .035);
    }

    .card-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card-heading h2 { margin: 0; font-size: 17px; }
    .muted { color: var(--muted); font-size: 13px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 14px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: var(--white);
      font-weight: 700;
      font-size: 13px;
    }

    .button:hover { filter: brightness(.94); }
    .button.secondary { background: #edf3ff; color: var(--blue); }
    .button.orange { background: var(--orange); }
    .button.red { background: var(--red); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fbfcff;
    }

    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 5px; font-size: 23px; font-weight: 800; }
    .stat-value.blue { color: var(--blue); }
    .stat-value.orange { color: var(--orange); }
    .stat-value.red { color: var(--red); }

    .habit-list { display: flex; flex-direction: column; gap: 10px; }

    .habit {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .habit-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #edf3ff;
      font-size: 21px;
    }

    .habit-name { margin-bottom: 3px; font-weight: 700; }
    .habit-meta { color: var(--muted); font-size: 12px; }
    .habit-streak { color: var(--orange); font-size: 12px; font-weight: 700; }

    .check-button {
      width: 38px;
      height: 38px;
      border: 2px solid #d4dbea;
      border-radius: 12px;
      background: var(--white);
      color: var(--white);
      font-size: 18px;
      font-weight: 800;
    }

    .check-button.done { border-color: var(--green); background: var(--green); }

    .icon-button {
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #98a2b3;
      font-size: 18px;
    }

    .icon-button:hover { background: #fff1f0; color: var(--red); }

    .calendar-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .calendar-top button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--white);
      color: var(--black);
    }

    .calendar-month { min-width: 130px; text-align: center; font-weight: 700; }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .weekday, .day {
      display: grid;
      place-items: center;
      min-height: 38px;
      border-radius: 10px;
      font-size: 13px;
    }

    .weekday { min-height: 28px; color: var(--muted); font-size: 11px; }
    .day { border: 1px solid transparent; background: #f8faff; }
    .day.empty { background: transparent; }
    .day.today { border-color: var(--blue); color: var(--blue); font-weight: 800; }
    .day.has-completion { background: #eaf8ef; color: #13803c; font-weight: 700; }
    .day.today.has-completion { border-color: var(--blue); }

    .chart-wrap { height: 205px; }
    canvas { width: 100%; height: 100%; }

    .todo-form, .habit-form {
      display: flex;
      gap: 8px;
    }

    input[type="text"], input[type="number"], textarea {
      width: 100%;
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--white);
      color: var(--black);
    }

    input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px #2563eb18; }

    .todo-list { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .todo-item input { accent-color: var(--blue); }
    .todo-text { flex: 1; font-size: 13px; }
    .todo-item.completed .todo-text { color: #98a2b3; text-decoration: line-through; }

    .empty-state { padding: 18px 8px; color: var(--muted); text-align: center; font-size: 13px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 16px;
      background: rgba(17, 24, 39, .48);
    }

    .modal-backdrop.open { display: grid; }

    .modal {
      width: min(460px, 100%);
      padding: 22px;
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 20px 60px rgba(0, 0, 0, .2);
    }

    .modal h2 { margin-bottom: 18px; }
    .form-field { margin-bottom: 13px; }
    .form-field label { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 700; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .image-preview { display: flex; align-items: center; gap: 10px; margin-top: 9px; }
    .image-preview img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; }
    .image-preview button { border: 0; background: none; color: var(--red); }

    .habit-image { width: 42px; height: 42px; border-radius: 12px; object-fit: cover; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    @media (max-width: 850px) {
      .layout { grid-template-columns: 1fr; }
      .side-column { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
      .todo-card { grid-column: 1 / -1; }
    }

    @media (max-width: 560px) {
      .app { padding: 15px; }
      header { align-items: flex-start; }
      .date-chip { display: none; }
      .side-column { display: flex; }
      .stats { gap: 7px; }
      .stat { padding: 11px 9px; }
      .stat-value { font-size: 19px; }
      .card { padding: 15px; }
      .habit { grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; }
      .habit-icon, .habit-image { width: 38px; height: 38px; }
      .habit-streak { display: none; }
      .day { min-height: 34px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <h1>HabitFlow</h1>
          <p class="subtitle">Small steps. Strong habits.</p>
        </div>
      </div>
      <div class="date-chip" id="todayLabel"></div>
    </header>

    <div class="layout">
      <main class="main-column">
        <section class="card">
          <div class="card-heading">
            <div>
              <h2>Today’s habits</h2>
              <span class="muted" id="habitDateLabel"></span>
            </div>
            <button class="button" id="openHabitModal">＋ Add habit</button>
          </div>

          <div class="stats">
            <div class="stat">
              <div class="stat-label">Completed today</div>
              <div class="stat-value blue" id="completedStat">0/0</div>
            </div>
            <div class="stat">
              <div class="stat-label">Completion rate</div>
              <div class="stat-value orange" id="rateStat">0%</div>
            </div>
            <div class="stat">
              <div class="stat-label">Active habits</div>
              <div class="stat-value red" id="activeStat">0</div>
            </div>
          </div>

          <div class="habit-list" id="habitList"></div>
        </section>

        <section class="card">
          <div class="card-heading">
            <div>
              <h2>Weekly progress</h2>
              <span class="muted">Habits completed each day</span>
            </div>
          </div>
          <div class="chart-wrap"><canvas id="progressChart"></canvas></div>
        </section>
      </main>

      <aside class="side-column">
        <section class="card">
          <div class="card-heading">
            <h2>Habit calendar</h2>
            <div class="calendar-top">
              <button id="prevMonth" aria-label="Previous month">‹</button>
              <span class="calendar-month" id="calendarMonth"></span>
              <button id="nextMonth" aria-label="Next month">›</button>
            </div>
          </div>
          <div class="calendar-grid" id="calendarGrid"></div>
          <p class="muted" style="margin:14px 0 0">Green days show at least one completed habit.</p>
        </section>

        <section class="card todo-card">
          <div class="card-heading">
            <div>
              <h2>To-do list</h2>
              <span class="muted">Keep today moving</span>
            </div>
          </div>
          <form class="todo-form" id="todoForm">
            <label class="sr-only" for="todoInput">Add a task</label>
            <input id="todoInput" type="text" placeholder="Add a task..." maxlength="120" required />
            <button class="button" type="submit">Add</button>
          </form>
          <div class="todo-list" id="todoList"></div>
        </section>
      </aside>
    </div>
  </div>

  <div class="modal-backdrop" id="habitModal">
    <form class="modal" id="habitForm">
      <h2>Add a habit</h2>
      <div class="form-field">
        <label for="habitName">Habit name</label>
        <input id="habitName" type="text" placeholder="e.g. Read for 20 minutes" maxlength="60" required />
      </div>
      <div class="form-field">
        <label for="habitIcon">Emoji icon</label>
        <input id="habitIcon" type="text" value="✨" maxlength="4" />
      </div>
      <div class="form-field">
        <label for="habitImage">Optional image</label>
        <input id="habitImage" type="file" accept="image/*" />
        <div class="image-preview" id="imagePreview"></div>
      </div>
      <div class="modal-actions">
        <button class="button secondary" type="button" id="cancelHabit">Cancel</button>
        <button class="button" type="submit">Save habit</button>
      </div>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "habitflow-data-v1";
    const today = new Date();

    const defaultData = {
      habits: [
        { id: "water", name: "Drink 8 glasses of water", icon: "💧", image: "", logs: {} },
        { id: "exercise", name: "Move your body", icon: "🏃", image: "", logs: {} },
        { id: "read", name: "Read for 20 minutes", icon: "📚", image: "", logs: {} }
      ],
      todos: []
    };

    function loadData() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return saved && Array.isArray(saved.habits) && Array.isArray(saved.todos) ? saved : structuredClone(defaultData);
      } catch {
        return structuredClone(defaultData);
      }
    }

    let data = loadData();
    let calendarDate = new Date(today.getFullYear(), today.getMonth(), 1);
    let pendingImage = "";

    const $ = (id) => document.getElementById(id);
    const dateKey = (date) => {
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (error) {
        alert("Your browser storage is full. Try removing a large image.");
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function getCompletedCount(key) {
      return data.habits.filter(habit => habit.logs && habit.logs[key]).length;
    }

    function getStreak(habit) {
      let streak = 0;
      const cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate());
      while (habit.logs && habit.logs[dateKey(cursor)]) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      }
      return streak;
    }

    function renderHeader() {
      $("todayLabel").textContent = today.toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });
      $("habitDateLabel").textContent = today.toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric"
      });
    }

    function renderHabits() {
      const key = dateKey(today);
      const completed = getCompletedCount(key);
      const total = data.habits.length;
      $("completedStat").textContent = `${completed}/${total}`;
      $("rateStat").textContent = `${total ? Math.round(completed / total * 100) : 0}%`;
      $("activeStat").textContent = total;

      if (!total) {
        $("habitList").innerHTML = '<div class="empty-state">No habits yet. Add one to get started.</div>';
        return;
      }

      $("habitList").innerHTML = data.habits.map(habit => {
        const done = Boolean(habit.logs && habit.logs[key]);
        const icon = habit.image
          ? `<img class="habit-image" src="${habit.image}" alt="">`
          : `<div class="habit-icon">${escapeHtml(habit.icon || "✨")}</div>`;
        return `
          <div class="habit">
            ${icon}
            <div>
              <div class="habit-name">${escapeHtml(habit.name)}</div>
              <div class="habit-meta">${done ? "Completed today" : "Not completed yet"}</div>
            </div>
            <span class="habit-streak">🔥 ${getStreak(habit)} day streak</span>
            <button class="check-button ${done ? "done" : ""}" data-action="toggle" data-id="${escapeHtml(habit.id)}" aria-label="${done ? "Undo" : "Complete"} ${escapeHtml(habit.name)}">${done ? "✓" : ""}</button>
            <button class="icon-button" data-action="delete" data-id="${escapeHtml(habit.id)}" aria-label="Delete ${escapeHtml(habit.name)}">×</button>
          </div>`;
      }).join("");
    }

    function renderCalendar() {
      const year = calendarDate.getFullYear();
      const month = calendarDate.getMonth();
      $("calendarMonth").textContent = calendarDate.toLocaleDateString(undefined, { month: "long", year: "numeric" });

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const headers = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      let html = headers.map(day => `<div class="weekday">${day}</div>`).join("");

      for (let i = 0; i < firstDay; i++) html += '<div class="day empty"></div>';

      for (let day = 1; day <= daysInMonth; day++) {
        const current = new Date(year, month, day);
        const key = dateKey(current);
        const isToday = key === dateKey(today);
        const hasCompletion = getCompletedCount(key) > 0;
        html += `<div class="day ${isToday ? "today" : ""} ${hasCompletion ? "has-completion" : ""}" title="${getCompletedCount(key)} habit(s) completed">${day}</div>`;
      }

      $("calendarGrid").innerHTML = html;
    }

    function renderChart() {
      const canvas = $("progressChart");
      const rect = canvas.getBoundingClientRect();
      if (!rect.width) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;
      const pad = { top: 15, right: 12, bottom: 32, left: 30 };
      const chartWidth = width - pad.left - pad.right;
      const chartHeight = height - pad.top - pad.bottom;
      const days = [];

      for (let i = 6; i >= 0; i--) {
        const day = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
        days.push({
          label: day.toLocaleDateString(undefined, { weekday: "short" }),
          count: getCompletedCount(dateKey(day))
        });
      }

      const max = Math.max(4, ...days.map(day => day.count));
      ctx.clearRect(0, 0, width, height);
      ctx.font = "11px system-ui";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      for (let i = 0; i <= 4; i++) {
        const y = pad.top + chartHeight - chartHeight * i / 4;
        ctx.strokeStyle = "#e9edf4";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.fillStyle = "#8791a3";
        ctx.fillText(String(Math.round(max * i / 4)), pad.left - 7, y);
      }

      const slot = chartWidth / days.length;
      const barWidth = Math.min(30, slot * .56);
      days.forEach((day, index) => {
        const barHeight = chartHeight * day.count / max;
        const x = pad.left + slot * index + (slot - barWidth) / 2;
        const y = pad.top + chartHeight - barHeight;
        ctx.fillStyle = index === days.length - 1 ? "#f97316" : "#2563eb";
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, Math.max(3, barHeight), 6);
        ctx.fill();
        ctx.fillStyle = "#667085";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText(day.label, x + barWidth / 2, height - pad.bottom + 10);
      });
    }

    function renderTodos() {
      if (!data.todos.length) {
        $("todoList").innerHTML = '<div class="empty-state">No tasks yet. Add something you want to finish.</div>';
        return;
      }

      $("todoList").innerHTML = data.todos.map(todo => `
        <div class="todo-item ${todo.done ? "completed" : ""}">
          <input type="checkbox" data-action="todo-toggle" data-id="${escapeHtml(todo.id)}" ${todo.done ? "checked" : ""} aria-label="Mark task complete">
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button class="icon-button" data-action="todo-delete" data-id="${escapeHtml(todo.id)}" aria-label="Delete task">×</button>
        </div>`).join("");
    }

    function render() {
      renderHeader();
      renderHabits();
      renderCalendar();
      renderTodos();
      renderChart();
    }

    $("habitList").addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const habit = data.habits.find(item => item.id === button.dataset.id);
      if (!habit) return;

      if (button.dataset.action === "toggle") {
        habit.logs = habit.logs || {};
        const key = dateKey(today);
        habit.logs[key] = !habit.logs[key];
        if (!habit.logs[key]) delete habit.logs[key];
      } else if (button.dataset.action === "delete") {
        data.habits = data.habits.filter(item => item.id !== habit.id);
      }

      saveData();
      render();
    });

    $("todoForm").addEventListener("submit", event => {
      event.preventDefault();
      const input = $("todoInput");
      const text = input.value.trim();
      if (!text) return;
      data.todos.unshift({ id: crypto.randomUUID(), text, done: false });
      input.value = "";
      saveData();
      renderTodos();
    });

    $("todoList").addEventListener("click", event => {
      const button = event.target.closest('button[data-action="todo-delete"]');
      if (!button) return;
      data.todos = data.todos.filter(todo => todo.id !== button.dataset.id);
      saveData();
      renderTodos();
    });

    $("todoList").addEventListener("change", event => {
      const checkbox = event.target.closest('input[data-action="todo-toggle"]');
      if (!checkbox) return;
      const todo = data.todos.find(item => item.id === checkbox.dataset.id);
      if (todo) todo.done = checkbox.checked;
      saveData();
      renderTodos();
    });

    $("prevMonth").addEventListener("click", () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() - 1, 1);
      renderCalendar();
    });

    $("nextMonth").addEventListener("click", () => {
      calendarDate = new Date(calendarDate.getFullYear(), calendarDate.getMonth() + 1, 1);
      renderCalendar();
    });

    $("openHabitModal").addEventListener("click", () => {
      $("habitModal").classList.add("open");
      $("habitName").focus();
    });

    function closeModal() {
      $("habitModal").classList.remove("open");
      $("habitForm").reset();
      $("habitIcon").value = "✨";
      $("habitImage").value = "";
      $("imagePreview").innerHTML = "";
      pendingImage = "";
    }

    $("cancelHabit").addEventListener("click", closeModal);
    $("habitModal").addEventListener("click", event => {
      if (event.target === $("habitModal")) closeModal();
    });

    $("habitImage").addEventListener("change", event => {
      const file = event.target.files[0];
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        alert("Please choose an image file.");
        event.target.value = "";
        return;
      }
      if (file.size > 1_500_000) {
        alert("Please choose an image smaller than 1.5 MB.");
        event.target.value = "";
        return;
      }

      const reader = new FileReader();
      reader.onload = () => {
        pendingImage = reader.result;
        $("imagePreview").innerHTML = `<img src="${pendingImage}" alt="Preview"><button type="button" id="removeImage">Remove image</button>`;
        $("removeImage").addEventListener("click", () => {
          pendingImage = "";
          $("habitImage").value = "";
          $("imagePreview").innerHTML = "";
        });
      };
      reader.readAsDataURL(file);
    });

    $("habitForm").addEventListener("submit", event => {
      event.preventDefault();
      const name = $("habitName").value.trim();
      if (!name) return;

      data.habits.push({
        id: crypto.randomUUID(),
        name,
        icon: $("habitIcon").value.trim() || "✨",
        image: pendingImage,
        logs: {}
      });

      saveData();
      closeModal();
      render();
    });

    window.addEventListener("resize", renderChart);
    render();
  </script>
</body>
</html>
